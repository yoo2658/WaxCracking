<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>왁스 뿌수기</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="scene-canvas"></canvas>

  <div id="wax-progress" aria-hidden="true">
    <div>남은 왁스 <span id="wax-progress-value">100.0</span>%</div>
    <div id="daily-break-count">오늘 부순 왁스 <span id="daily-break-count-value">0</span>개</div>
  </div>

  <div id="completion-banner" role="status" aria-live="polite">
    <button type="button" id="completion-close" aria-label="닫기">✕</button>
    <p class="completion-title">부수기 완료!</p>
    <p id="completion-time"></p>
    <p id="completion-clicks"></p>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <div id="ui-wrapper">
    <button type="button" id="quick-reset-button" aria-label="새 왁스로 리셋" title="새 왁스로 리셋">↺</button>

    <div id="ui">
    <div class="ui-header">
      <h1>왁스 뿌수기</h1>
      <button type="button" id="help-button" aria-label="설명 보기">?</button>
      <button type="button" id="ui-toggle" aria-label="메뉴 열기/닫기">✕</button>
    </div>

    <div id="ui-body">
      <section>
        <h2>종류</h2>
        <div class="button-row" data-group="material">
          <button type="button" data-value="clay" class="active">클레이</button>
          <button type="button" data-value="slime">슬라임</button>
          <button type="button" data-value="waxbbu">왁뿌볼</button>
        </div>
      </section>

      <section>
        <div class="button-row">
          <button type="button" id="random-wax-button">랜덤 왁뿌 🎲</button>
        </div>
      </section>

      <section id="wax-type-section">
        <h2>왁스 종류</h2>
        <div class="button-row" data-group="waxType">
          <button type="button" data-value="basic" class="active">기본</button>
          <button type="button" data-value="chocolate">초콜릿</button>
          <button type="button" data-value="sand">모래</button>
        </div>
        <div class="button-row" data-group="waxType">
          <button type="button" data-value="butter">버터</button>
          <button type="button" data-value="strawberry">딸기</button>
          <button type="button" data-value="grape">청포도</button>
          <button type="button" data-value="milk">밀크</button>
        </div>
        <div class="button-row" data-group="waxType">
          <button type="button" data-value="croissant">크루아상</button>
        </div>
      </section>

      <section>
        <h2>텍스처</h2>
        <div class="texture-row">
          <input type="color" id="color-picker" value="#fefad7" />
          <label class="file-button">
            사진 등록
            <input type="file" id="photo-input" accept="image/png,image/jpeg" hidden />
          </label>
          <button type="button" id="remove-photo" disabled>사진 제거</button>
        </div>
        <p id="photo-name" class="hint"></p>
      </section>

      <section>
        <h2>볼륨</h2>
        <input type="range" id="volume-slider" min="0" max="100" value="100" />
      </section>

      <section>
        <h2>화면</h2>
        <div class="button-row" data-group="theme">
          <button type="button" data-value="dark" class="active">다크 모드</button>
          <button type="button" data-value="light">라이트 모드</button>
        </div>
      </section>

      <section>
        <button type="button" id="reset-button" class="reset">새 왁스로 리셋</button>
      </section>
    </div>
    </div>
  </div>

  <div id="help-panel" role="dialog" aria-live="polite">
    <button type="button" id="help-close" aria-label="닫기">✕</button>
    <p class="help-title">모든 왁스를 부숴보세요!</p>
    <ul class="help-list">
      <li>배경이 투명한 사진을 넣으면 모양이 만들어져요.</li>
      <li>새 왁스는 1.5초 이상 눌러야 떨어져요.</li>
      <li>그 뒤로는 같은 곳을 몇 번 누르면 조각이 떨어져요.</li>
      <li>클릭한 순간부터 눌리고, 오래 누를 수록 세게 눌려요.</li>
      <li>드래그해서 왁스를 돌려보세요.</li>
    </ul>
  </div>

  <script src="dist/bundle.js"></script>
</body>
</html>
