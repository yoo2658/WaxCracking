<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>왁스 뿌수기</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="scene-canvas"></canvas>

  <svg id="press-progress" width="64" height="64" viewBox="0 0 64 64" aria-hidden="true">
    <circle cx="32" cy="32" r="26" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="6" />
    <circle
      id="press-progress-fill"
      cx="32" cy="32" r="26"
      fill="none"
      stroke="#f0d75c"
      stroke-width="6"
      stroke-linecap="round"
      stroke-dasharray="163.36"
      stroke-dashoffset="163.36"
      transform="rotate(-90 32 32)"
    />
  </svg>

  <div id="ui-wrapper">
    <button type="button" id="quick-reset-button" aria-label="새 왁스로 리셋" title="새 왁스로 리셋">↺</button>

    <div id="ui">
    <div class="ui-header">
      <h1>왁스 뿌수기</h1>
      <button type="button" id="ui-toggle" aria-label="메뉴 열기/닫기">✕</button>
    </div>

    <div id="ui-body">
      <section>
        <h2>왁스 종류</h2>
        <div class="button-row" data-group="waxType">
          <button type="button" data-value="basic" class="active">기본</button>
          <button type="button" data-value="chocolate">초콜릿</button>
          <button type="button" data-value="sand">모래</button>
        </div>
      </section>

      <section>
        <h2>재질</h2>
        <div class="button-row" data-group="material">
          <button type="button" data-value="clay" class="active">클레이</button>
          <button type="button" data-value="slime">슬라임</button>
        </div>
      </section>

      <section>
        <h2>텍스처</h2>
        <div class="texture-row">
          <input type="color" id="color-picker" value="#f0d75c" />
          <label class="file-button">
            사진 등록
            <input type="file" id="photo-input" accept="image/png,image/jpeg" hidden />
          </label>
          <button type="button" id="remove-photo" disabled>사진 제거</button>
        </div>
        <p id="photo-name" class="hint"></p>
      </section>

      <section>
        <h2>볼륨</h2>
        <input type="range" id="volume-slider" min="0" max="100" value="100" />
      </section>

      <section>
        <button type="button" id="reset-button" class="reset">새 왁스로 리셋</button>
      </section>

      <p class="hint">클릭한 순간부터 눌리고, 오래 누를수록 세게 눌려요. 새 왁스는 1.5초 이상 눌러야 처음 크게 갈라져요. 그 뒤로는 같은 곳을 몇 번 누르면 조각이 떨어져요. 드래그하면 시점을 돌려볼 수 있어요. 슬라임은 눌린 모양이 손을 떼면 되돌아가요.</p>
    </div>
    </div>
  </div>

  <script src="dist/bundle.js"></script>
</body>
</html>
